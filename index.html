addEventListener('resize',()=>{fit();applyVideoFit('A');applyVideoFit('B');});


const TS_BASE_URL =
  "https://script.google.com/macros/s/AKfycbzOxP9ZUxVe2BVp4QWql4sxdvIlUrB1VoXvSx2lW3sARUX8vFj8fMb23vveuUdNloZnaA/exec";

function getSVMemberId(){
  try{
    const p = new URLSearchParams(location.search);
    return (p.get("member") || p.get("id") || "").trim().toUpperCase();
  }catch(e){
    return "";
  }
}

function openTSStandalone(){
  const memberId = getSVMemberId();
  let url = TS_BASE_URL + "?page=ts";
  if(memberId){
    url += "&id=" + encodeURIComponent(memberId);
  }

  const w = window.open(url, "TUP_TS_STANDALONE");

  }
  try{ w.focus(); }catch(e){}
}

function toast(msg){
 const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
 clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1700)
}

function applyVideoFit(side){
  const s=state[side];
  const layer=document.getElementById('videoLayer'+side);
  const live=document.getElementById('live'+side);
  const replay=document.getElementById('replay'+side);
  if(!layer)return;

  const rot=((s.rotate||0)%360+360)%360;
  const isQuarterTurn=(rot===90||rot===270);
  const W=layer.clientWidth;
  const H=layer.clientHeight;

  [live,replay].forEach(v=>{
    if(!v)return;

    // Critical fix:
    // For 90° / 270°, swap the CSS box dimensions BEFORE rotation.
    // After rotation the bounding box becomes exactly W x H again,
    // so the source frame is never cropped at the head/feet.
    if(isQuarterTurn){
      v.style.width=H+'px';
      v.style.height=W+'px';
    }else{
      v.style.width=W+'px';
      v.style.height=H+'px';
    }

    v.style.left='50%';
    v.style.top='50%';
    v.style.objectFit='contain';
    v.style.objectPosition='center center';
    v.style.transformOrigin='center center';
    v.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;
  });
}

  return 1;

}

function isSingleCamABMode(){
  if(state.A.stream && state.B.stream && state.A.stream===state.B.stream)return true;
  const a=getTrackDeviceId('A'),b=getTrackDeviceId('B');
  if(a&&b&&a===b)return true;
  if(selectedDeviceA&&selectedDeviceB&&selectedDeviceA===selectedDeviceB)return true;
  return false;
}

  state.B.rotate=state.A.rotate;
  state.B.fitScale=state.A.fitScale;
  v71ApplyLiveRotation('A');

function enableReplayControls(side,on){
  const ids=[];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.disabled=!on;
  });

function updateSeekFromVideo(side){
  const r=document.getElementById('replay'+side);
  const seek=document.getElementById('seek'+side);
  if(!r||!seek||!Number.isFinite(r.duration)||r.duration<=0)return;
  seek.value=Math.round((r.currentTime/r.duration)*1000);
}

function bindReplayControls(){
  ['A','B'].forEach(side=>{
    const r=document.getElementById('replay'+side);
    const seek=document.getElementById('seek'+side);
    const vol=document.getElementById('vol'+side);
    if(!r)return;

    r.addEventListener('timeupdate',()=>updateSeekFromVideo(side));
    r.addEventListener('loadedmetadata',()=>{
      enableReplayControls(side,true);
      updateSeekFromVideo(side);
    });

    if(seek)seek.addEventListener('input',()=>{
      if(!Number.isFinite(r.duration)||r.duration<=0)return;
      const t=r.duration*(Number(seek.value)/1000);

      if(isSingleCamABMode()){
        ['A','B'].forEach(s=>{
          const rr=document.getElementById('replay'+s);
          const ss=document.getElementById('seek'+s);
          if(rr&&Number.isFinite(rr.duration)){
            rr.currentTime=Math.min(t,rr.duration||t);
            if(ss)ss.value=seek.value;
          }
        });
      }else{
        r.currentTime=t;
      }
    });

    if(vol)vol.addEventListener('input',()=>{
      const v=Number(vol.value)/100;
      r.volume=v;
      if(isSingleCamABMode()){
        const other=side==='A'?'B':'A';
        const or=document.getElementById('replay'+other);
        const ov=document.getElementById('vol'+other);
        if(or)or.volume=v;
        if(ov)ov.value=vol.value;
      }
    });
  });
}

function syncReplayToBoth(sourceSide,blob){

  const targetSide=sourceSide==='A'?'B':'A';
  const target=state[targetSide];

  const targetUrl=URL.createObjectURL(blob);

  const targetPreviousBlob=target.lastBlob;
  target.lastBlob=blob;
  if(targetPreviousBlob && targetPreviousBlob!==blob){
    target.recentSavedBlob=targetPreviousBlob;
    if(target.recentSavedUrl){try{URL.revokeObjectURL(target.recentSavedUrl)}catch(e){}}
    target.recentSavedUrl=URL.createObjectURL(targetPreviousBlob);
  }
  target.url=targetUrl;
  target.rotate=state[sourceSide].rotate;
  target.fitScale=state[sourceSide].fitScale;
  // Keep the Recent Saved Video UI in sync for the mirrored side too.
  updateRecentSavedButton(targetSide);

  const sr=document.getElementById('replay'+sourceSide);
  const tr=document.getElementById('replay'+targetSide);
  if(!sr||!tr)return false;

  tr.src=targetUrl;
  tr.loop=true;
  tr.volume=REPLAY_VOLUME;

  const launch=()=>{
    try{
      showReplay(sourceSide,false);
      showReplay(targetSide,false);

      sr.loop=true; tr.loop=true;
      sr.currentTime=0; tr.currentTime=0;
      sr.volume=REPLAY_VOLUME; tr.volume=REPLAY_VOLUME;

      enableReplayControls('A',true);
      enableReplayControls('B',true);

      const va=document.getElementById('volA');
      const vb=document.getElementById('volB');
      if(va)va.value=Math.round(REPLAY_VOLUME*100);
      if(vb)vb.value=Math.round(REPLAY_VOLUME*100);

      const p1=sr.play(),p2=tr.play();
      if(p1&&p1.catch)p1.catch(()=>{});
      if(p2&&p2.catch)p2.catch(()=>{});

      document.getElementById('modeA').textContent='A · REPLAY';
      document.getElementById('modeB').textContent='B · REPLAY';

      if(old&&old!==targetUrl){
        try{URL.revokeObjectURL(old)}catch(e){}
      }
    }catch(e){console.warn('A/B replay sync',e)}
  };

  if(tr.readyState>=2)launch();
  else{
    tr.onloadeddata=()=>{tr.onloadeddata=null;launch()};
    try{tr.load()}catch(e){}
  }
  return true;
}

function disconnectCam(side){

 if(s.recorder&&s.recorder.state!=='inactive')try{s.recorder.stop()}catch(e){}

}

 }

}
function startClip(side){
 const s=state[side];
 const live=document.getElementById('live'+side);
 const replay=document.getElementById('replay'+side);
 const mode=document.getElementById('mode'+side);

 // POSE capture: keep the previous replay visible and looping while the next
 // swing is recorded from the hidden LIVE stream in the background.
 const keepPreviousReplay=!!(s.poseCapture && s.url && replay && replay.style.display==='block');

 if(!keepPreviousReplay){
   try{
     if(replay){
       replay.loop=false;
       replay.onended=null;
       replay.pause();
       replay.style.display='none';
     }
     if(live)live.style.display='block';
     if(mode)mode.textContent=side+' · LIVE';
   }catch(e){}
 }

 if(!s.stream){toast(side+' 카메라를 먼저 연결하세요.');return}
 if(!window.MediaRecorder){toast('이 브라우저는 녹화를 지원하지 않습니다.');return}
 if(s.recorder&&s.recorder.state!=='inactive')return;

 s.chunks=[];
 let mime='';
 for(const m of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']){
   if(MediaRecorder.isTypeSupported(m)){mime=m;break}
 }
 try{s.recorder=new MediaRecorder(s.stream,mime?{mimeType:mime}:undefined)}
 catch(e){s.recorder=new MediaRecorder(s.stream)}

 s.recorder.ondataavailable=e=>{
   if(e.data&&e.data.size)s.chunks.push(e.data)
 };

 s.recorder.onstop=()=>{
   if(!s.chunks.length){
     s.poseAutoReplay=false;
     s.poseCapture=false;
     return;
   }

   const newBlob=new Blob(s.chunks,{type:s.recorder.mimeType||'video/webm'});
   const newUrl=URL.createObjectURL(newBlob);
   const oldUrl=s.url;

   // Preserve the clip that was on screen BEFORE this new swing.
   // "최근저장영상" means the immediately previous captured clip, not the current replay.
   const previousBlob=s.lastBlob;
   s.lastBlob=newBlob;
   if(previousBlob && previousBlob!==newBlob){
     s.recentSavedBlob=previousBlob;
     if(s.recentSavedUrl){try{URL.revokeObjectURL(s.recentSavedUrl)}catch(e){}}
     s.recentSavedUrl=URL.createObjectURL(previousBlob);
   }
   s.url=newUrl;
   updateRecentSavedButton(side);

   const r=document.getElementById('replay'+side);
   const wantReplay=!!(s.auto || s.poseAutoReplay);
   s.poseAutoReplay=false;
   s.poseCapture=false;

   // Swap to the newly completed swing only now.
   r.pause();
   r.onended=null;
   r.src=newUrl;
   r.volume=REPLAY_VOLUME;
   r.onloadedmetadata=()=>applyVideoFit(side);

   if(wantReplay){
     const singleCamSync=isSingleCamABMode();
     r.onloadeddata=()=>{
       r.onloadeddata=null;
       if(singleCamSync)syncReplayToBoth(side,newBlob);
       else showReplay(side,true);
       if(oldUrl && oldUrl!==newUrl){
         try{URL.revokeObjectURL(oldUrl)}catch(e){}
       }
     };
     try{r.load()}catch(e){}
     setTimeout(()=>{
       if(s.url===newUrl && document.getElementById('mode'+side)?.textContent!==side+' · REPLAY'){
         if(isSingleCamABMode()){
           const other=side==='A'?'B':'A';
           if(state[other]?.lastBlob!==newBlob)syncReplayToBoth(side,newBlob);
         }else{
           showReplay(side,true);
         }
         if(oldUrl && oldUrl!==newUrl){
           try{URL.revokeObjectURL(oldUrl)}catch(e){}
         }
       }
     },600);
   }else if(oldUrl && oldUrl!==newUrl){
     try{URL.revokeObjectURL(oldUrl)}catch(e){}
   }
 };

 s.recorder.start(200);
 document.getElementById('camState'+side).textContent='촬영중';

 // Ordinary timed recording still stops at 6 seconds.
 // POSE recording is stopped only by the swing/replay controller.
 if(!s.poseCapture){
   setTimeout(()=>{
     if(s.recorder&&s.recorder.state==='recording'){
       s.recorder.stop();
       document.getElementById('camState'+side).textContent='연결됨';
     }
   },6000);
 }
}

}

function v71ApplyLiveRotation(side){
  const live=document.getElementById('live'+side);
  const layer=document.getElementById('videoLayer'+side);
  if(!live)return;

  const rot=((state[side]?.rotate||0)%360+360)%360;

  // Apply rotation immediately to the visible LIVE element.
  live.style.transformOrigin='center center';

  if(rot===90 || rot===270){
    // For quarter-turns, swap scale basis so the rotated video fills naturally.
    const lw=layer?.clientWidth||live.parentElement?.clientWidth||1;
    const lh=layer?.clientHeight||live.parentElement?.clientHeight||1;
    const vw=live.videoWidth||1280;
    const vh=live.videoHeight||720;

    const rotatedW=vh;
    const rotatedH=vw;
    const scale=Math.min(lw/rotatedW, lh/rotatedH);

    live.style.width=vw+'px';
    live.style.height=vh+'px';
    live.style.left='50%';
    live.style.top='50%';
    live.style.position='absolute';
    live.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;
  }else{
    live.style.left='50%';
    live.style.top='50%';
    live.style.position='absolute';
    live.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;
  }
}

function showReplay(side,autoplay=false){
  const s=state[side];
  const live=document.getElementById('live'+side);
  const r=document.getElementById('replay'+side);
  const mode=document.getElementById('mode'+side);
  const camState=document.getElementById('camState'+side);

  if(!r || !s || !s.url){
    v70KeepLiveVisible(side);
    // No valid replay yet: keep LIVE visible.
    if(live)live.style.display='block';
    if(r)r.style.display='none';
    if(mode)mode.textContent=side+' · LIVE';
    return;
  }

  r.loop=!!autoplay;
  r.onended=autoplay?()=>{
    try{
      r.currentTime=0;
      const again=r.play();
      if(again&&typeof again.catch==='function')again.catch(()=>{});
    }catch(e){}
  }:null;
  r.src=s.url;
  r.volume=REPLAY_VOLUME;

  const enterReplay=()=>{
    try{
      if(live)live.style.display='none';
      r.style.display='block';
      if(mode)mode.textContent=side+' · REPLAY';
      if(camState)camState.textContent='리플레이';
      applyVideoFit(side);
      if(autoplay){
        r.currentTime=0;
        const p=r.play();
        if(p&&typeof p.catch==='function')p.catch(()=>{});
      }
    }catch(e){
      console.error('showReplay error',e);
      if(live)live.style.display='block';
      r.style.display='none';
      if(mode)mode.textContent=side+' · LIVE';
    }
  };

  // Only switch away from LIVE after replay video really has data.
  if(r.readyState>=2){
    enterReplay();
  }else{
    r.onloadeddata=()=>{
      r.onloadeddata=null;
      enterReplay();
    };
    try{r.load()}catch(e){}
  }
}

function playRecentSaved(side){
 const s=state[side];
 const blob=s&&s.recentSavedBlob;
 if(!s||!blob){toast(side+' 최근 저장 영상이 없습니다.');return}
 const r=document.getElementById('replay'+side);
 const live=document.getElementById('live'+side);
 const mode=document.getElementById('mode'+side);
 const camState=document.getElementById('camState'+side);
 if(!r)return;

 try{
   // Recent Saved Video has its own persistent object URL.
   // Do not reuse/revoke the active replay URL while this clip is loading.
   if(!s.recentSavedUrl){
     s.recentSavedUrl=URL.createObjectURL(blob);
   }
   const recentUrl=s.recentSavedUrl;

   r.pause();
   r.onended=null;
   r.onloadeddata=null;
   r.onloadedmetadata=null;
   r.onerror=null;
   try{r.removeAttribute('src')}catch(e){}
   r.src=recentUrl;
   r.preload='auto';
   r.loop=true;
   r.playbackRate=window.SV95PlaybackRate||1;
   r.volume=typeof masterVolume==='number'?masterVolume:REPLAY_VOLUME;
   s.url=recentUrl;

   const reveal=()=>{
     if(live)live.style.display='none';
     r.style.display='block';
     if(mode)mode.textContent=side+' · REPLAY';
     if(camState)camState.textContent='최근저장영상';
     try{applyVideoFit(side)}catch(e){}
     enableReplayControls(side,true);
     try{r.currentTime=0}catch(e){}
     updateSeekFromVideo(side);
   };

   const start=()=>{
     reveal();
     const p=r.play();
     if(p&&p.catch)p.catch(()=>{ /* clip is loaded even if autoplay is blocked */ });
     toast(side+' 최근 저장 영상 불러옴');
   };

   r.onloadedmetadata=()=>{
     reveal();
     try{r.currentTime=0}catch(e){}
   };
   r.onloadeddata=()=>{
     r.onloadeddata=null;
     start();
   };
   r.onerror=()=>{
     toast(side+' 최근 저장 영상 로드 실패');
   };

   // Switch the visible layer immediately, then force a fresh load.
   if(live)live.style.display='none';
   r.style.display='block';
   if(mode)mode.textContent=side+' · REPLAY';
   r.load();

   // Some Chromium builds may already have the blob cached and skip loadeddata.
   setTimeout(()=>{
     if(r.readyState>=2){
       reveal();
       if(r.paused){
         const p=r.play();
         if(p&&p.catch)p.catch(()=>{});
       }
     }
   },300);
 }catch(e){
   console.error('playRecentSaved',e);
   toast(side+' 최근 저장 영상 재생 오류');
 }
}

<script>
/* ===== V62 POSE / READY / SOUND / SHOT DETECT ===== */
let readyAudioCtx=null;
let poseEngines={A:null,B:null}, poseEnabled={A:false,B:false}, poseRunning={A:false,B:false};
let jointVisible={A:true,B:false};
const poseInputFrames={
 A:document.createElement('canvas'),
 B:document.createElement('canvas')
};

function getPoseInputFrame(side,video){
  const rot=((state[side]?.rotate||0)%360+360)%360;

  if(rot===0)return video;

  const c=poseInputFrames[side];
  const ctx=c.getContext('2d');
  const vw=video.videoWidth||video.clientWidth||1280;
  const vh=video.videoHeight||video.clientHeight||720;

  if(rot===90 || rot===270){
    if(c.width!==vh)c.width=vh;
    if(c.height!==vw)c.height=vw;
  }else{
    if(c.width!==vw)c.width=vw;
    if(c.height!==vh)c.height=vh;
  }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate(rot*Math.PI/180);
  ctx.drawImage(video,-vw/2,-vh/2,vw,vh);
  ctx.setTransform(1,0,0,1,0,0);

  return c;
}

let shotPhase='WAIT_ADDRESS', addressSince=0, stableFrames=0, lastWrist=null, lastTime=0, addressWrist=null, swingStart=0, lastShotAt=0;
let smoothWrist=null;
let v53PrevPose=null, v53PrevTime=0;
let v53AddressSince=0, v53AddressLocked=false, v53ReadyAt=0;
let v54ReadyPlayed=false, v54MissingSince=0, v54RecordStarted=false;
let v60MicStream=null, v60AudioCtx=null, v60Analyser=null, v60MicLoop=null;
let v60AudioArmed=false, v60IgnoreAudioUntil=0, v60LastHitAt=0, v60RecentAudioHit=0;
let v61SwingPending=false, v61SwingPendingAt=0, v61ShotConfirmed=false;

function v60GolfAddress(lm){
  if(!lm)return false;

  // Reference V9 / V11.1B style landmarks
  const needed=[11,12,15,16,23,24,25,26,27,28];
  for(const i of needed){
    const p=lm[i];
    if(!p || (p.visibility!=null && p.visibility<0.20))return false;
  }

  const ls=lm[11], rs=lm[12], lh=lm[23], rh=lm[24];
  const lk=lm[25], rk=lm[26], la=lm[27], ra=lm[28];
  const lw=lm[15], rw=lm[16];

  const shoulderMid={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2};
  const hipMid={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2};
  const kneeMid={x:(lk.x+rk.x)/2,y:(lk.y+rk.y)/2};
  const ankleMid={x:(la.x+ra.x)/2,y:(la.y+ra.y)/2};
  const handMid={x:(lw.x+rw.x)/2,y:(lw.y+rw.y)/2};

  const torsoLen=Math.max(0.001,v53Dist(shoulderMid,hipMid));
  const feetGap=Math.abs(la.x-ra.x);
  const kneeGap=Math.abs(lk.x-rk.x);
  const handGap=v53Dist(lw,rw);
  const handBelowShoulders=(handMid.y-shoulderMid.y)/torsoLen;
  const handFromHips=Math.abs(handMid.y-hipMid.y)/torsoLen;
  const hipToKnee=Math.max(0.001,v53Dist(hipMid,kneeMid));
  const kneeToAnkle=Math.max(0.001,v53Dist(kneeMid,ankleMid));
  const bodyCentered=hipMid.x>0.18 && hipMid.x<0.82;

  const hipLevelDiff=Math.abs(lh.y-rh.y);
  const kneeLevelDiff=Math.abs(lk.y-rk.y);
  const ankleLevelDiff=Math.abs(la.y-ra.y);

  const obviousOneLeg =
    (hipLevelDiff>0.085 && kneeLevelDiff>0.095) ||
    (kneeLevelDiff>0.13) ||
    (ankleLevelDiff>0.12 && hipLevelDiff>0.065);

  let score=0;
  if(bodyCentered)score++;
  if(feetGap>=0.055 && feetGap<=0.38)score++;
  if(kneeGap>=0.04 && kneeGap<=0.34)score++;
  if(handGap<=0.24)score++;
  if(handBelowShoulders>=0.45 && handBelowShoulders<=2.50)score++;
  if(handFromHips<=1.55)score++;
  if(hipToKnee>=0.13 && kneeToAnkle>=0.13)score++;

  // Same reference rule: 5 of 7 and not an obvious one-leg stance.
  return score>=5 && !obviousOneLeg;
}

async function v60EnsureMic(){
  if(v60MicStream && v60Analyser)return true;
  try{
    v60MicStream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      },
      video:false
    });
    v60AudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=v60AudioCtx.createMediaStreamSource(v60MicStream);
    v60Analyser=v60AudioCtx.createAnalyser();
    v60Analyser.fftSize=1024;
    v60Analyser.smoothingTimeConstant=0.12;
    src.connect(v60Analyser);
    v60StartMicLoop();
    return true;
  }catch(e){
    console.warn('Audio hit mic unavailable',e);
    return false;
  }
}

function v60StartMicLoop(){
  if(v60MicLoop || !v60Analyser)return;
  const buf=new Uint8Array(v60Analyser.fftSize);
  let baseline=.015;

  const tick=()=>{
    if(!v60Analyser){v60MicLoop=null;return;}
    v60Analyser.getByteTimeDomainData(buf);

    let sum=0, peak=0;
    for(let i=0;i<buf.length;i++){
      const x=(buf[i]-128)/128;
      const a=Math.abs(x);
      sum+=x*x;
      if(a>peak)peak=a;
    }
    const rms=Math.sqrt(sum/buf.length);

    // Slowly learn room noise floor.
    baseline=baseline*.985 + Math.min(rms,.08)*.015;

    const now=performance.now();
    const threshold=Math.max(.022, baseline*1.9);

    if(v60AudioArmed &&
       now>v60IgnoreAudioUntil &&
       now-v60LastHitAt>500 &&
       rms>threshold &&
       peak>Math.max(.085,threshold*1.55)){
      v60RecentAudioHit=now;   // remember impact transient even if POSE is a frame late
      if(typeof v60ConfirmShotFromAudio==='function')v60ConfirmShotFromAudio();
      v60LastHitAt=now;
    }

    v60MicLoop=requestAnimationFrame(tick);
  };
  v60MicLoop=requestAnimationFrame(tick);
}

function v60ConfirmShotFromAudio(){
  const now=performance.now();

  if(now<v60IgnoreAudioUntil)return;
  if(shotPhase!=='SWING' || !v61SwingPending)return;

  // POSE can lag behind the actual impact sound by a few frames.
  // Accept a latched hit from up to 420 ms before the current SWING frame,
  // or a new hit up to 2.0 sec after swing start.
  const soundAge=now-v60RecentAudioHit;
  const sinceSwing=now-v61SwingPendingAt;

  const latchedHit=(soundAge>=0 && soundAge<=420);
  const liveHit=(sinceSwing>=0 && sinceSwing<=2000 && soundAge<=180);

  if(!latchedHit && !liveHit)return;

  v61ShotConfirmed=true;
  v61SwingPending=false;
  v60AudioArmed=false;
  lastShotAt=now;
  shotPhase='SHOT';
  setPoseHeaderState('POSE · SHOT + AUDIO');

  if(typeof launchFlightAtImpact==='function')
    launchFlightAtImpact('POSE+AUDIO',{soundConfirmed:true});

  if(typeof sensorShotDetected==='function')
    sensorShotDetected({
      source:'POSE+AUDIO',
      camera:'A',
      timestamp:now,
      payload:{soundConfirmed:true}
    });

  // Replay was already scheduled when POSE SWING was detected.

  setTimeout(()=>{
    shotPhase='WAIT_ADDRESS';
    stableFrames=0;
    v53AddressSince=0;
    v53AddressLocked=false;
    v53ReadyAt=0;
    v53PrevPose=null;
    v53PrevTime=0;
    v54ReadyPlayed=false;
    v60AudioArmed=!!v60Analyser; // keep mic hot for next shot
    v61ShotConfirmed=false;
    setPoseHeaderState('POSE · ADDRESS 확인중');
  },1400);
}

let v56ReplayTimer=null, v56ReplayPending=false;

function v54Presence(lm){
  const ls=v53Point(lm,11,.45), rs=v53Point(lm,12,.45);
  const lh=v53Point(lm,23,.35), rh=v53Point(lm,24,.35);
  const lw=v53Point(lm,15,.25), rw=v53Point(lm,16,.25);
  const le=v53Point(lm,13,.25), re=v53Point(lm,14,.25);

  const shoulderOk=!!(ls||rs);
  const hipOk=!!(lh||rh);
  const armOk=!!(lw||rw||le||re);

  let geomOk=true;
  const s=ls||rs, h=lh||rh;
  if(s&&h){
    const torso=v53Dist(s,h);
    geomOk = torso>0.08 && torso<0.55;
  }
  return shoulderOk && hipOk && armOk && geomOk;
}

function v54StartReplayRecord(){
  if(v54RecordStarted) return;
  v54RecordStarted=true;
  try{
    state.A.poseCapture=true;
    if(typeof startClip==='function'){
      const r=startClip('A');
      if(r && typeof r.catch==='function') r.catch(()=>{});
    }
  }catch(e){
    state.A.poseCapture=false;
    v54RecordStarted=false;
  }
}

function v54FinishReplayRecord(){
  const s=state.A;
  try{
    s.poseAutoReplay=true;
    if(s.recorder && s.recorder.state==='recording'){
      s.recorder.stop();
      const st=document.getElementById('camStateA');
      if(st)st.textContent='리플레이 준비';
    }else if(s.url){
      s.poseAutoReplay=false;
      showReplay('A',true);
    }else{
      s.poseAutoReplay=false;
    }
  }catch(e){
    s.poseAutoReplay=false;
    console.error('POSE replay stop error',e);
  }
  v54RecordStarted=false;
}

function v56ScheduleReplay(){
  if(v56ReplayPending)return;
  v56ReplayPending=true;
  if(v56ReplayTimer)clearTimeout(v56ReplayTimer);

  // SWING detected -> keep finish through impact/finish, then replay regardless of SHOT classifier.
  v56ReplayTimer=setTimeout(()=>{
    v56ReplayTimer=null;
    v54FinishReplayRecord();
    v56ReplayPending=false;
  },2300);
}

function v56CancelReplay(){
  if(v56ReplayTimer)clearTimeout(v56ReplayTimer);
  v56ReplayTimer=null;
  v56ReplayPending=false;
}


function v53Point(lm,i,th=.15){
  const p=lm&&lm[i];
  return p && (p.visibility==null || p.visibility>=th) ? p : null;
}
function v53Dist(a,b){
  return (!a||!b) ? 0 : Math.hypot(a.x-b.x,a.y-b.y);
}
function v53PersonVisible(lm){
  if(!lm || lm.length<25) return false;
  const ids=[11,12,13,14,15,16,23,24];
  let n=0;
  for(const i of ids) if(v53Point(lm,i,.12)) n++;
  return n>=3;
}
function v53Metrics(lm,now){
  // V9 poseMotionMetrics formula, using current SV state variable names.
  if(!v53PrevPose || !v53PrevTime){
    v53PrevPose=lm.map(p=>({x:p.x,y:p.y}));
    v53PrevTime=now;
    return {stability:0,handSpeed:0,shoulderTurn:0,pelvisSpeed:0,ankleSpeed:0};
  }

  const dt=Math.max(0.016,(now-v53PrevTime)/1000);
  const ids=[11,12,13,14,15,16,23,24,25,26,27,28];

  let sum=0,n=0;
  for(const i of ids){
    if(lm[i] && v53PrevPose[i]){
      sum+=v53Dist(lm[i],v53PrevPose[i]);
      n++;
    }
  }
  const stability=n?sum/n:0;

  const pelvis={
    x:(lm[23].x+lm[24].x)/2,
    y:(lm[23].y+lm[24].y)/2
  };
  const prevPelvis={
    x:(v53PrevPose[23].x+v53PrevPose[24].x)/2,
    y:(v53PrevPose[23].y+v53PrevPose[24].y)/2
  };
  const pelvisSpeed=v53Dist(pelvis,prevPelvis)/dt;

  const ankles={
    x:(lm[27].x+lm[28].x)/2,
    y:(lm[27].y+lm[28].y)/2
  };
  const prevAnkles={
    x:(v53PrevPose[27].x+v53PrevPose[28].x)/2,
    y:(v53PrevPose[27].y+v53PrevPose[28].y)/2
  };
  const ankleSpeed=v53Dist(ankles,prevAnkles)/dt;

  // V9: midpoint of both hands, relative to pelvis.
  const hands={
    x:(lm[15].x+lm[16].x)/2,
    y:(lm[15].y+lm[16].y)/2
  };
  const prevHands={
    x:(v53PrevPose[15].x+v53PrevPose[16].x)/2,
    y:(v53PrevPose[15].y+v53PrevPose[16].y)/2
  };
  const relHands={x:hands.x-pelvis.x,y:hands.y-pelvis.y};
  const prevRelHands={x:prevHands.x-prevPelvis.x,y:prevHands.y-prevPelvis.y};
  const handSpeed=v53Dist(relHands,prevRelHands)/dt;

  const shoulderNow=Math.atan2(
    lm[12].y-lm[11].y,
    lm[12].x-lm[11].x
  );
  const shoulderPrev=Math.atan2(
    v53PrevPose[12].y-v53PrevPose[11].y,
    v53PrevPose[12].x-v53PrevPose[11].x
  );
  let shoulderTurn=Math.abs(shoulderNow-shoulderPrev);
  if(shoulderTurn>Math.PI)shoulderTurn=2*Math.PI-shoulderTurn;

  v53PrevPose=lm.map(p=>({x:p.x,y:p.y}));
  v53PrevTime=now;

  return {stability,handSpeed,shoulderTurn,pelvisSpeed,ankleSpeed};
}

function resizePose(side){
 const c=document.getElementById('pose'+side);
 const layer=document.getElementById('videoLayer'+side);
 const live=document.getElementById('live'+side);
 if(!c||!layer||!live)return;

 const W=Math.max(1,layer.clientWidth);

 const rot=((state[side]?.rotate||0)%360+360)%360;
 const vw=live.videoWidth||1280;
 const vh=live.videoHeight||720;

 // POSE coordinates already come from the rotated/normalized input frame.
 // Therefore the overlay itself must NOT be rotated again.
 let visualW,visualH;

 if(rot===90 || rot===270){
   const rw=vh, rh=vw;
   const scale=Math.min(W/rw,H/rh);
   visualW=rw*scale;
   visualH=rh*scale;
 }else{
   const scale=Math.min(W/vw,H/vh);
   visualW=vw*scale;
   visualH=vh*scale;

 c.width=Math.max(1,Math.round(visualW));
 c.height=Math.max(1,Math.round(visualH));

function ema(prev,cur,a=.42){return prev?{x:prev.x*(1-a)+cur.x*a,y:prev.y*(1-a)+cur.y*a}:{...cur}}

/* V51 감지 원칙
   1) A에서 몸통 2점 + 팔 1점 이상만 보이면 ADDRESS 후보.
   2) 자세/손목 높이를 따지지 않고 0.6초 연속 검출 -> READY.
   3) READY 기준 손/팔이 몸통 크기의 0.18 이상 이동하거나 속도가 충분하면 SWING.
   4) SWING 후 0.18초 이상 + 큰 이동/속도면 SHOT 확정.
*/
function detectSwing(l){
  if(typeof BALL_SENSOR_CONNECTED!=='undefined' && BALL_SENSOR_CONNECTED)return;

  const now=performance.now();
  const present=v54Presence(l);

  if(!present){
    if(!v54MissingSince)v54MissingSince=now;
    if(now-v54MissingSince>250){
      stableFrames=0;
      v53AddressSince=0;
      v53AddressLocked=false;
      v53ReadyAt=0;
      v53PrevPose=null;
      v53PrevTime=0;
      v54ReadyPlayed=false;
      v60AudioArmed=false;
      v61SwingPending=false;
      v61ShotConfirmed=false;
      if(shotPhase!=='SHOT')shotPhase='WAIT_ADDRESS';
      showReadyCenter(false);
      setPoseHeaderState('POSE · BODY 확인중');
    }
    return;
  }
  v54MissingSince=0;

  const m=v53Metrics(l,now);

  if(shotPhase==='WAIT_ADDRESS'){
    setPoseHeaderState('POSE · ADDRESS 확인중');

    const golfAddress=v60GolfAddress(l);

    if(
      golfAddress &&
      m.stability<0.020 &&
      (m.pelvisSpeed==null || m.pelvisSpeed<0.055) &&
      (m.ankleSpeed==null || m.ankleSpeed<0.050)
    ){
      if(!v53AddressSince)v53AddressSince=now;

      if(now-v53AddressSince>=850){
        v53AddressLocked=true;
        shotPhase='READY';
        v53ReadyAt=now;
        setPoseHeaderState('POSE · READY');
        showReadyCenter(true);

        if(!v54ReadyPlayed){
          v54ReadyPlayed=true;
          playReadyBeep();
          v60IgnoreAudioUntil=performance.now()+550;
        }

        if(v60Analyser){
          v60AudioArmed=true;
        }else{
          v60EnsureMic().then(ok=>{v60AudioArmed=!!ok;});
        }

        // Record next swing in background while previous replay keeps looping.
        v54StartReplayRecord();
      }
    }else{
      v53AddressSince=0;
      v53AddressLocked=false;
    }
    return;
  }

  if(shotPhase==='READY'){
    const swingCandidate =
      (m.handSpeed>0.11 && m.shoulderTurn>0.008) ||
      (m.handSpeed>0.19);

    if(now-v53ReadyAt>120 && swingCandidate){
      shotPhase='SWING';
      swingStart=now;
      v61SwingPending=true;
      v61SwingPendingAt=now;
      v61ShotConfirmed=false;
      showReadyCenter(false);
      setPoseHeaderState('POSE · SWING 감지');

      // V9 behavior: a valid POSE swing always produces a replay.
      // Ball audio is supplemental SHOT confirmation and must not block replay.
      if(typeof v56ScheduleReplay==='function')v56ScheduleReplay();

      // Consume a ball-hit transient that arrived a few frames before POSE switched to SWING.
      if(performance.now()-v60RecentAudioHit<=420){
        v60ConfirmShotFromAudio();
        return;
      }

      // IMPORTANT: do NOT replace replay yet.
      // Wait for a real ball-hit sound to confirm this swing.
    }
    return;
  }

  if(shotPhase==='SWING'){
    const elapsed=now-swingStart;

    // Replay is already scheduled from the valid POSE swing.
    // If audio is not detected, keep the replay but label it as POSE-only.
    if(elapsed>2200 && !v61ShotConfirmed){
      v61SwingPending=false;
      v60AudioArmed=false;
      setPoseHeaderState('POSE · SHOT');

      setTimeout(()=>{
        shotPhase='WAIT_ADDRESS';
        stableFrames=0;
        v53AddressSince=0;
        v53AddressLocked=false;
        v53ReadyAt=0;
        v53PrevPose=null;
        v53PrevTime=0;
        v54ReadyPlayed=false;
        setPoseHeaderState('POSE · ADDRESS 확인중');
      },900);
    }
  }
}

<script>

/* ===== APPROVED REPLAY CONTROL FUNCTIONS ===== */
(function(){
  const FRAME_STEP = 1/60;

  function replay(side){ return document.getElementById('replay'+side); }
  function seek(side){ return document.getElementById('seek'+side); }

  window.stepFrameExact=function(side,dir){
    const v=replay(side);
    if(!v || !Number.isFinite(v.duration) || v.duration<=0){
      try{toast(side+' 리플레이 영상이 없습니다.')}catch(e){}
      return;
    }
    try{v.pause()}catch(e){}
    v.currentTime=Math.max(0,Math.min(v.duration,(v.currentTime||0)+(dir*FRAME_STEP)));
  };

  function bindSeek(side){
    const v=replay(side);
    const q=seek(side);
    if(!v || !q) return;

    const sync=()=>{
      if(!Number.isFinite(v.duration)||v.duration<=0) return;
      q.value=Math.round((v.currentTime/v.duration)*1000);
    };

    const move=()=>{
      if(!Number.isFinite(v.duration)||v.duration<=0) return;
      v.currentTime=(Number(q.value)/1000)*v.duration;
    };

    q.disabled=false;
    q.addEventListener('input',move);
    q.addEventListener('change',move);
    v.addEventListener('timeupdate',sync);
    v.addEventListener('loadedmetadata',sync);
    v.addEventListener('durationchange',sync);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    bindSeek('A');
    bindSeek('B');
  });
})();


/* ===== V96 SHOT DISTANCE HISTORY FUNCTION ===== */
const svShotHistory=[];
let svShotSequence=0;
const SV_SHOT_VISIBLE_ROWS=6;

function sv96Number(v){
  if(v===null||v===undefined||v==='')return null;
  const n=Number(v);
  return Number.isFinite(n) ? n : null;
}
function sv96PickDistance(obj,keys){
  if(!obj)return null;
  for(const k of keys){
    const n=sv96Number(obj[k]);
    if(n!==null)return n;
  }
  if(obj.payload && obj.payload!==obj)return sv96PickDistance(obj.payload,keys);
  return null;
}
function renderSV96ShotPanel(){
  const list=document.getElementById('shotDistanceList');
  const avgCarry=document.getElementById('shotAverageCarry');
  const avgTotal=document.getElementById('shotAverageTotal');
  if(!list||!avgCarry||!avgTotal)return;
  const carryMeasured=svShotHistory.filter(x=>x.carry!==null);
  const totalMeasured=svShotHistory.filter(x=>x.total!==null);
  avgCarry.textContent=carryMeasured.length
    ? (carryMeasured.reduce((sum,x)=>sum+x.carry,0)/carryMeasured.length).toFixed(1) : '--';
  avgTotal.textContent=totalMeasured.length
    ? (totalMeasured.reduce((sum,x)=>sum+x.total,0)/totalMeasured.length).toFixed(1) : '--';
  const rows=svShotHistory.slice(-SV_SHOT_VISIBLE_ROWS);
  list.innerHTML=rows.map(x=>{
    const pending=(x.carry===null&&x.total===null);
    const carry=x.carry===null?'--':x.carry.toFixed(1);
    const total=x.total===null?'--':x.total.toFixed(1);
    return `<div class="shotRow${pending?' pending':''}"><span class="shotNo">${x.no}타</span><span class="shotValue">${carry} / <b>${total}</b> m</span></div>`;
  }).join('');
}
function addSV96Shot(data={}){
  const carry=sv96PickDistance(data,['carry','carryDistance','carry_distance','carryM']);
  const total=sv96PickDistance(data,['total','distance','totalDistance','total_distance','distanceM']);
  const row={no:++svShotSequence,carry,total,timestamp:data.timestamp||Date.now()};
  svShotHistory.push(row);
  renderSV96ShotPanel();
  return row.no;
}
function updateSV96Shot(data={}){
  const carry=sv96PickDistance(data,['carry','carryDistance','carry_distance','carryM']);
  const total=sv96PickDistance(data,['total','distance','totalDistance','total_distance','distanceM']);
  let row=null;
  const requested=Number(data.shotNo||data.no||data.sequence);
  if(Number.isFinite(requested))row=svShotHistory.find(x=>x.no===requested)||null;
  if(!row)row=[...svShotHistory].reverse().find(x=>x.carry===null&&x.total===null)||svShotHistory[svShotHistory.length-1]||null;
  if(!row)return addSV96Shot(data);
  if(carry!==null)row.carry=carry;
  if(total!==null)row.total=total;
  renderSV96ShotPanel();
  return row.no;
}
function receiveSV96Shot(data={}){
  const hasDistance=sv96PickDistance(data,['carry','carryDistance','carry_distance','carryM','total','distance','totalDistance','total_distance','distanceM'])!==null;
  if(hasDistance){
    const pending=[...svShotHistory].reverse().find(x=>x.carry===null&&x.total===null);
    return pending?updateSV96Shot(data):addSV96Shot(data);
  }
  return addSV96Shot(data);
}
window.SVShotPanel={add:addSV96Shot,update:updateSV96Shot,receive:receiveSV96Shot,history:svShotHistory,render:renderSV96ShotPanel};
window.updateShotDistance=updateSV96Shot;
window.receiveShotDistance=receiveSV96Shot;

/* Preserve any sensor hook that existed before V96; otherwise use this panel as the hook. */
if(typeof window.sensorShotDetected!=='function'){

    const r=sv96PreviousSensorShotDetected.apply(this,arguments);
    receiveSV96Shot(data||{});
    return r;
  };
}

</script>

  try{showReplay('B',false)}catch(e){}

  const seekZero=(v)=>new Promise((resolve)=>{
    let done=false;
    const finish=()=>{if(done)return;done=true;cleanup();resolve()};
    const cleanup=()=>{
      v.removeEventListener('seeked',finish);
      v.removeEventListener('canplay',finish);
      v.removeEventListener('loadeddata',finish);
    };
    v.addEventListener('seeked',finish,{once:true});
    v.addEventListener('canplay',finish,{once:true});

  }catch(e){}

  if(!target){
    msg('TS100 연결창을 찾지 못했습니다. TS100에서 SV를 연 상태인지 확인해주세요.');
    return;
  }

  var rotation = 0;
  try{
    rotation = ((state[side].rotate||0)%360+360)%360;
  }catch(e){}

  try{
    target.postMessage({
      type:'TUP_SV_VIDEO',
      slot:side,
      blob:blob,
      rotation:rotation,
      view:side==='A'?'FRONT':'SIDE',
      createdAt:Date.now()
    },'*');

    msg('✓ '+side+'화면을 TS100으로 보냈습니다.');
  }catch(err){
    console.error(err);
    msg(side+'화면 전송 실패: '+err.message);
  }
}

function install(){
  var stage = document.getElementById('stage');
  if(!stage || document.getElementById('tupOnlySendA')) return;

  var a = document.createElement('button');
  a.id = 'tupOnlySendA';
  a.type = 'button';
  a.textContent = 'A화면 보내기';
  a.onclick = function(){ send('A'); };

  var b = document.createElement('button');
  b.id = 'tupOnlySendB';
  b.type = 'button';
  b.textContent = 'B화면 보내기';
  b.onclick = function(){ send('B'); };

  stage.appendChild(a);
  stage.appendChild(b);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',install,{once:true});
}else{
  install();
}
})();
</script>


<!-- PATCH ONLY: remember real TS100 sender window -->
<script id="tup-sv-ts100-handshake-fix">
(function(){
'use strict';
window.__tupTS100Window=null;

window.addEventListener('message',function(ev){
  var d=ev&&ev.data;
  if(!d || d.type!=='TUP_TS100_HELLO') return;
  if(ev.source && typeof ev.source.postMessage==='function'){
    window.__tupTS100Window=ev.source;
    try{
      ev.source.postMessage({type:'TUP_SV_READY',source:'SV100',receivedAt:Date.now()},'*');
    }catch(e){}
  }
});

/* announce readiness to opener too, when opener exists */
try{
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({type:'TUP_SV_READY',source:'SV100',sentAt:Date.now()},'*');
  }
}catch(e){}
})();
</script>

<script id="tup-sv-send-handshake-override">
(function(){
'use strict';
function msg(t){
  try{if(typeof toast==='function'){toast(t);return;}}catch(e){}
  console.log(t);
}
function send(side){
  side=side==='B'?'B':'A';
  var blob=null;
  try{blob=state&&state[side]&&state[side].lastBlob;}catch(e){}
  if(!blob){msg(side+'화면에 보낼 최근 리플레이 영상이 없습니다.');return;}

  var target=window.__tupTS100Window;
  try{
    if((!target || target.closed) && window.opener && !window.opener.closed) target=window.opener;
  }catch(e){}

  if(!target || target.closed){
    msg('TS100 연결 대기 중입니다. TS100의 SV 열기에서 다시 열어주세요.');
    return;
  }

  var rotation=0;
  try{rotation=((state[side].rotate||0)%360+360)%360;}catch(e){}
  try{
    target.postMessage({
      type:'TUP_SV_VIDEO',
      slot:side,
      blob:blob,
      rotation:rotation,
      view:side==='A'?'FRONT':'SIDE',
      source:'SV100',
      createdAt:Date.now()
    },'*');
    msg('✓ '+side+'화면을 TS100으로 보냈습니다.');
  }catch(e){
    console.error(e);
    msg(side+'화면 전송 실패: '+e.message);
  }
}
function bind(){
  var a=document.getElementById('tupOnlySendA');
  var b=document.getElementById('tupOnlySendB');
  if(a) a.onclick=function(e){e.preventDefault();send('A');};
  if(b) b.onclick=function(e){e.preventDefault();send('B');};
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind);
else bind();
setTimeout(bind,300);
})();
</script>
