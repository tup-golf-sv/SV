<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-UP SV 회원영상 선택</title>
<style>
html,body{margin:0;background:#07110d;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{padding:20px}
h1{margin:0 0 10px;font-size:20px}
p{margin:7px 0;color:#d9e7df;font-size:14px;line-height:1.5}
button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:#0d6b49;color:#fff}
.secondary{background:#e9eeeB;color:#183128}
#msg{margin-top:10px;font-size:13px;color:#f3d36b;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">회원 영상 폴더 연결</h1>
  <p id="desc">SV에서 기억한 저장폴더를 확인하고 있습니다.</p>
  <button id="openBtn" class="primary" hidden>회원폴더 열기</button>
  <button id="rootBtn" class="secondary" hidden>SV영상 폴더 다시 지정</button>
  <div id="msg"></div>
</div>
<script>
(function(){
'use strict';

const DB_NAME='TUP_SV_STORAGE';
const DB_VERSION=1;
const STORE='handles';
const KEY='SV_VIDEO_ROOT';

const p=new URLSearchParams(location.search);
const member=String(p.get('member')||'').trim();
const side=(p.get('side')==='B'?'B':'A');
const action=String(p.get('action')||'pick').toLowerCase();

const title=document.getElementById('title');
const desc=document.getElementById('desc');
const openBtn=document.getElementById('openBtn');
const rootBtn=document.getElementById('rootBtn');
const msg=document.getElementById('msg');

title.textContent=(member||'회원')+' · '+side+(action==='save'?' 화면저장':' 영상 선택');

function safeName(v){
  return String(v||'').trim()
    .replace(/[\\/:*?"<>|]/g,'_')
    .replace(/\s+/g,'_') || '미지정회원';
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains(STORE)){
        r.result.createObjectStore(STORE);
      }
    };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

async function loadRoot(){
  try{
    const db=await openDB();
    return await new Promise(resolve=>{
      const tx=db.transaction(STORE,'readonly');
      const q=tx.objectStore(STORE).get(KEY);
      q.onsuccess=()=>resolve(q.result||null);
      q.onerror=()=>resolve(null);
    });
  }catch(e){return null;}
}

async function saveRoot(h){
  const db=await openDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(h,KEY);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

let root=null;
let memberDir=null;

async function prepare(){
  root=await loadRoot();

  if(!root){
    desc.textContent='이 GitHub/SV origin에 저장된 SV영상 폴더 정보가 없습니다.';
    rootBtn.hidden=false;
    return false;
  }

  try{
    let q=await root.queryPermission({mode:'read'});
    if(q!=='granted'){
      desc.textContent='SV영상 폴더 권한이 필요합니다.';
      rootBtn.hidden=false;
      return false;
    }

    /* 저장모드에서는 회원폴더가 아직 없으면 생성 허용.
       선택모드는 기존 동작 그대로 기존 회원폴더만 연다. */
    memberDir=await root.getDirectoryHandle(safeName(member),{create:(action==='save')});
    desc.textContent='SV영상 → '+safeName(member)+' 폴더가 준비되었습니다.';

    if(action==='save'){
      openBtn.hidden=true;
      rootBtn.hidden=true;
      msg.textContent='TS 화면저장 데이터를 기다리는 중입니다...';
      try{
        if(window.opener && !window.opener.closed){
          window.opener.postMessage({
            type:'TUP_TS_MEMBER_SAVE_HELPER_READY',
            memberName:member,
            side:side
          },'*');
        }
      }catch(e){}
    }else{
      openBtn.hidden=false;
    }
    return true;
  }catch(e){
    desc.textContent='SV영상 안에 '+safeName(member)+' 회원폴더를 찾지 못했습니다.';
    rootBtn.hidden=false;
    return false;
  }
}

/* =========================
   V4 실측보완
   - FileSystemFileHandle.getFile() 원본을 postMessage로 바로 넘기지 않음
   - 실제 bytes(ArrayBuffer)를 다시 읽어 새 File로 재구성
   - WebM/MP4 기본 헤더를 확인한 뒤 TS로 전달
   - UI/폴더구조/파일목록 방식은 그대로 유지
========================= */

function hex4(u8){
  return Array.from(u8.slice(0,16)).map(v=>v.toString(16).padStart(2,'0')).join(' ');
}

function detectContainer(u8,name,type){
  if(u8.length>=4 && u8[0]===0x1A && u8[1]===0x45 && u8[2]===0xDF && u8[3]===0xA3){
    return {kind:'webm', mime:'video/webm', ok:true};
  }
  if(u8.length>=12 &&
     u8[4]===0x66 && u8[5]===0x74 && u8[6]===0x79 && u8[7]===0x70){
    return {kind:'mp4', mime:'video/mp4', ok:true};
  }

  var lower=String(name||'').toLowerCase();
  var t=String(type||'').toLowerCase();

  if(/^image\//.test(t) || /\.(png|jpe?g|webp|bmp)$/i.test(lower)){
    return {kind:'image', mime:type||'application/octet-stream', ok:true};
  }

  return {kind:'unknown', mime:type||'application/octet-stream', ok:false};
}

async function rebuildFileForTS(file){
  if(!(file instanceof Blob)){
    throw new Error('선택 파일이 Blob/File 객체가 아닙니다.');
  }
  if(!file.size){
    throw new Error('선택 파일 크기가 0 byte 입니다.');
  }

  var buffer=await file.arrayBuffer();
  if(!buffer || !buffer.byteLength){
    throw new Error('파일 바이트를 읽지 못했습니다.');
  }

  var head=new Uint8Array(buffer,0,Math.min(32,buffer.byteLength));
  var info=detectContainer(head,file.name,file.type);

  if(!info.ok){
    throw new Error(
      '영상 컨테이너 헤더를 확인할 수 없습니다.\\n'+
      '파일: '+String(file.name||'')+'\\n'+
      '크기: '+buffer.byteLength+' bytes\\n'+
      'type: '+String(file.type||'(없음)')+'\\n'+
      'header: '+hex4(head)
    );
  }

  var mime=info.mime || file.type || 'application/octet-stream';
  var rebuilt=new File(
    [buffer],
    file.name || ('TS_'+side+'_'+Date.now()),
    {type:mime,lastModified:Number(file.lastModified||Date.now())}
  );

  return {
    file:rebuilt,
    container:info.kind,
    bytes:buffer.byteLength,
    mime:mime,
    header:hex4(head)
  };
}

async function pickMemberFile(){
  if(!memberDir){
    msg.textContent='회원폴더가 준비되지 않았습니다.';
    return;
  }

  try{
    var files=[];
    for await (const entry of memberDir.values()){
      if(entry.kind!=='file')continue;
      var name=String(entry.name||'');
      if(!/\.(webm|mp4|mov|m4v|avi|png|jpg|jpeg|webp|bmp)$/i.test(name))continue;

      try{
        var f=await entry.getFile();
        files.push({
          handle:entry,
          file:f,
          name:name,
          modified:Number(f.lastModified||0)
        });
      }catch(e){}
    }

    files.sort(function(a,b){return b.modified-a.modified;});

    if(!files.length){
      msg.textContent='이 회원폴더에 영상/이미지 파일이 없습니다.';
      return;
    }

    openBtn.hidden=true;
    rootBtn.hidden=true;
    desc.textContent=safeName(member)+' 회원폴더 · 파일을 선택하세요.';

    var old=document.getElementById('memberFileList');
    if(old)old.remove();

    var list=document.createElement('div');
    list.id='memberFileList';
    list.style.marginTop='12px';
    list.style.maxHeight='330px';
    list.style.overflowY='auto';

    files.forEach(function(item){
      var b=document.createElement('button');
      b.type='button';
      b.className='secondary';
      b.style.textAlign='left';
      b.style.marginTop='7px';
      b.style.minHeight='42px';
      b.textContent=item.name;

      b.onclick=async function(){
        try{
          b.disabled=true;
          msg.textContent='원본 파일 바이트를 확인하는 중입니다...';

          var original=await item.handle.getFile();
          var rebuilt=await rebuildFileForTS(original);

          if(!window.opener || window.opener.closed){
            throw new Error('TS 창과 연결이 끊어졌습니다.');
          }

          window.opener.postMessage({
            type:'TUP_TS_MEMBER_PICKED_FILE',
            side:side,
            memberName:member,
            fileName:rebuilt.file.name,
            file:rebuilt.file,
            byteLength:rebuilt.bytes,
            container:rebuilt.container,
            mime:rebuilt.mime,
            header:rebuilt.header,
            rebuilt:true
          },'*');

          msg.textContent=
            'TS '+side+' 화면으로 실제 바이트 전달 완료\\n'+
            rebuilt.container.toUpperCase()+' · '+rebuilt.bytes+' bytes · '+rebuilt.mime;

          setTimeout(function(){window.close();},900);
        }catch(e){
          console.error(e);
          b.disabled=false;
          msg.textContent='전달 실패\\n'+String(e&&e.message||e);
        }
      };

      list.appendChild(b);
    });

    document.querySelector('.wrap').appendChild(list);
    msg.textContent='총 '+files.length+'개 파일을 찾았습니다.';
  }catch(e){
    console.error(e);
    msg.textContent='회원폴더의 파일 목록을 읽지 못했습니다.';
  }
}

rootBtn.onclick=async function(){
  try{
    const h=await window.showDirectoryPicker({
      id:'TUP_SV_VIDEO_ROOT',
      mode:'readwrite',
      startIn:'downloads'
    });

    root=h;
    await saveRoot(h);
    rootBtn.hidden=true;
    msg.textContent='SV영상 폴더를 기억했습니다.';
    await prepare();
  }catch(e){
    if(e && e.name!=='AbortError'){
      console.error(e);
      msg.textContent='SV영상 폴더를 지정하지 못했습니다.';
    }
  }
};

openBtn.onclick=pickMemberFile;

/* =========================
   TS PC 화면저장 → 현재회원 폴더 직접저장
   - TS(Apps Script/file origin)의 Blob을 GitHub HELPER로 postMessage
   - HELPER가 보유한 SV_VIDEO_ROOT DirectoryHandle로 직접 기록
   - 저장위치: SV영상 / 현재회원 /
========================= */
window.addEventListener('message',async function(ev){
  var d=ev&&ev.data;
  if(action!=='save' || !d || d.type!=='TUP_TS_MEMBER_SCREEN_SAVE')return;
  if(window.opener && ev.source!==window.opener)return;

  try{
    if(!memberDir)throw new Error('현재 회원폴더가 준비되지 않았습니다.');
    if(!(d.blob instanceof Blob))throw new Error('PNG Blob을 받지 못했습니다.');
    if(!d.blob.size)throw new Error('PNG 파일 크기가 0 byte 입니다.');

    var incoming=String(d.memberName||'').trim();
    if(incoming && safeName(incoming)!==safeName(member)){
      throw new Error('현재 회원과 저장 요청 회원이 다릅니다.');
    }

    var fileName=String(d.fileName||'').trim();
    if(!fileName)fileName=safeName(member)+'_'+Date.now()+'_TS_'+side+'_화면저장.png';
    fileName=fileName.replace(/[\\/:*?"<>|]/g,'_');
    if(!/\.png$/i.test(fileName))fileName+='.png';

    msg.textContent='현재 회원폴더에 저장하는 중입니다...\n'+fileName;

    var fh=await memberDir.getFileHandle(fileName,{create:true});
    var w=await fh.createWritable();
    await w.write(d.blob);
    await w.close();

    msg.textContent=
      '저장 완료\n'+
      'SV영상 → '+safeName(member)+' → '+fileName+'\n'+
      Math.round(d.blob.size/1024)+' KB';

    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({
          type:'TUP_TS_MEMBER_SCREEN_SAVE_RESULT',
          ok:true,
          memberName:member,
          side:side,
          fileName:fileName,
          bytes:d.blob.size
        },'*');
      }
    }catch(e){}

    setTimeout(function(){window.close();},900);
  }catch(e){
    console.error(e);
    msg.textContent='화면저장 실패\n'+String(e&&e.message||e);
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({
          type:'TUP_TS_MEMBER_SCREEN_SAVE_RESULT',
          ok:false,
          memberName:member,
          side:side,
          error:String(e&&e.message||e)
        },'*');
      }
    }catch(x){}
  }
},false);

prepare();

})();
</script>
</body>
</html>
